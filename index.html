<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한국정책연구소 대시보드 — 주소가 바뀌었습니다</title>
<meta http-equiv="refresh" content="3;url=https://seongsooyoon.github.io/kpri-board/">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:#0f172a;color:#e2e8f0;padding:24px;text-align:center}
  .w{max-width:420px}
  h1{font-size:20px;margin:0 0 12px;font-weight:700}
  p{font-size:15px;line-height:1.7;color:#94a3b8;margin:0 0 20px}
  a{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;
    padding:14px 24px;border-radius:12px;font-weight:600;font-size:16px}
  small{display:block;margin-top:18px;color:#64748b;font-size:12px}
</style>
</head>
<body>
<div class="w">
  <h1>📋 대시보드 주소가 바뀌었습니다</h1>
  <p>새 주소로 이동합니다. 넘어가지 않으면 아래 버튼을 눌러 주세요.<br>
     기존 홈 화면 아이콘은 삭제하고 새 주소에서 다시 추가해 주십시오.</p>
  <a href="https://seongsooyoon.github.io/kpri-board/">새 대시보드 열기</a>
  <small>한국정책연구소 · 2026-08-10 공개 채널 단일화</small>
</div>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
    }
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.replace('https://seongsooyoon.github.io/kpri-board/');
})();
</script>
</body>
</html>
